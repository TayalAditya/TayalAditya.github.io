<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Redirecting…</title>
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; font: 15px/1.5 system-ui, sans-serif; color: #374151; background: #f7f7f5; }
</style>
</head>
<body>
<p id="message">Redirecting…</p>
<script>
(function () {
  // Sign-in relay: providers only redirect to a fixed HTTPS address, so they come here and
  // this page forwards the browser to the app that started the sign-in. The address comes
  // from the "state" value and must be a private network or local address, so this page
  // cannot send anyone to an outside site.
  var message = document.getElementById('message');
  var query = new URLSearchParams(location.search);
  var state = query.get('state') || '';
  var target = null;
  try {
    var part = state.split('.')[0].replace(/-/g, '+').replace(/_/g, '/');
    target = JSON.parse(atob(part + '==='.slice((part.length + 3) % 4)));
  } catch (error) {
    target = null;
  }
  var origin = target && target.r;
  var provider = target && target.p;
  var privateOrigin = /^https?:\/\/(10(\.\d{1,3}){3}|172\.(1[6-9]|2\d|3[01])(\.\d{1,3}){2}|192\.168(\.\d{1,3}){2}|localhost|127\.0\.0\.1)(:\d{1,5})?$/;
  if (!privateOrigin.test(origin || '') || !/^(google|github|adobe)$/.test(provider || '')) {
    message.textContent = 'This sign-in link is not valid.';
    return;
  }
  location.replace(origin + '/api/v1/auth/oauth/' + provider + '/callback' + location.search);
})();
</script>
</body>
</html>
